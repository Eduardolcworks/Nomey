name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the Node version: .nvmrc. Keeping the
      # version out of this file stops CI and local dev from drifting apart.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Domain tests. They run the shared vectors in tests/vectors, which the
      # authoritative server implementation will have to reproduce exactly.
      # tests/infra also runs here: it checks the versioned configuration -which
      # schemas the Data API exposes- without needing a database.
      - name: Test
        run: npm test

      # Los assets de marca son ficheros versionados que un editor de imagenes
      # puede reescribir sin que el diff diga nada util: un PNG cambia entero.
      # Lo que tiene que sobrevivir es geometrico -que la marca ocupe lo mismo
      # y siga centrada- y eso se mide, no se mira. Node puro, sin dependencias
      # ni cadena nativa, asi que cabe en este job.
      - name: Brand asset geometry
        run: node scripts/icon-geometry-check.mjs

  environments:
    name: Variantes y guarda del bundle
    runs-on: ubuntu-latest

    # Las dos comprobaciones de F08/ADR-002 que no caben en `npm test`: resuelven la
    # configuracion de verdad con la CLI de Expo y exportan el bundle, y cada
    # invocacion cuesta segundos. En su propio job para que no alarguen el
    # camino corto de typecheck/lint/tests.
    #
    # NO USA NINGUN SECRETO DEL REPOSITORIO, y es la decision que cierra la
    # duda que `bundle-secrets-check.sh` dejaba escrita para la Fase 8.
    # `EXPO_PUBLIC_SUPABASE_URL` y `EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY` son
    # configuracion publica, no secretos, asi que la matriz las pone FICTICIAS.
    # Meter aqui un valor real seria contradictorio: es el job cuyo unico
    # proposito es demostrar que en el bundle no hay valores reales.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Las tres variantes resuelven, tienen la identidad de F08/ADR-002 §1, no
      # difieren en nada mas, una ausente da development y una desconocida falla.
      - name: Variant matrix
        run: node scripts/variant-matrix-check.mjs

      # Las tres se exportan sin ninguna credencial de backend dentro, y un
      # secreto sembrado a proposito hace fallar la guarda. Sin ese caso
      # negativo, un grep roto pasaria en verde igual que un bundle limpio.
      - name: Bundle secrets matrix
        run: ./scripts/bundle-secrets-matrix.sh

  database:
    name: Migrations rebuilt from zero
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The wrapper pins the CLI version in a single line and downloads the
      # Linux binary to the npm cache, never into node_modules. `npm ci` is
      # deliberately NOT run here: this job needs no project dependencies.
      #
      # Only postgres, kong, postgrest and gotrue are started. PostgREST is kept
      # on purpose: if the api schema stopped existing it would fail its health
      # check, and that is the F03/ADR-011 bootstrap guard for free.
      #
      # Kong cannot be excluded while postgrest is kept. The CLI probes
      # PostgREST's readiness through the gateway, at
      # http://127.0.0.1:54321/rest-admin/v1/ready, and 54321 is Kong's
      # published port. Without Kong, PostgREST starts and serves correctly but
      # the probe cannot reach it, so `start` fails with a transport error.
      # Measured: it reproduces locally with this exact command.
      #
      # GOTRUE WAS ADDED when phase 3 closed, and it is the only stack change
      # the closure needed. Every other check simulates identity with
      # `set_config('request.jwt.claims', ...)`, which cannot prove that a JWT
      # actually issued by Auth resolves to `authenticated`. The HTTP boundary
      # check below needs real users, and real users need Auth. Mailpit stays
      # excluded: `enable_confirmations = false` in config.toml, so signup
      # returns a session without sending any mail. Measured locally with this
      # exact topology.
      - name: Start Supabase, applying every migration from zero
        run: >
          ./scripts/supabase-cli.sh start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Bootstrap checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/bootstrap.sql

      - name: Core ledger checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/core-ledger.sql

      # Scope, participant, membership and effect. This one exercises the
      # client read path as `authenticated`, which needs auth.uid() to resolve
      # simulated request.jwt.claims. Measured: auth.uid() ships with the
      # postgres image, not with GoTrue, so it works in this job even though
      # gotrue is excluded above.
      - name: Scope and effect checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/scope-effect.sql

      # Participant-account link and presence periods. This one also proves
      # btree_gist is installed and actually provides the GiST operator class
      # uuid lacks, which is what makes the overlap exclusion declarative.
      - name: Participant identity checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/participant-identity.sql

      # Contextual split and frozen conversion. Closes the persisted-fact
      # inventory of F03/ADR-010 §1: after this, everything that ADR declares
      # authoritative-persisted exists.
      - name: Split and conversion checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/split-conversion.sql

      # Canonical projection and economic attribution. Also enforces the
      # catalogue guard of F03/ADR-010 §9 -only the canonical projection may depend
      # directly on core.effect- and that no bigint crosses the api surface.
      - name: Canonical projection and attribution checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/canonical-attribution.sql

      # Authoritative writer, first half. This one is piped through the vector
      # prelude: psql runs inside the container and cannot read the checkout,
      # so tests/vectors/*.json travel on the same stdin. F01/ADR-001 §7 requires
      # the PL/pgSQL implementation to reproduce them exactly, and F03/ADR-006 §1
      # accepts that the calculation is written a second time precisely because
      # the vectors — not shared code — are what detect drift.
      # `shell: bash` is not decoration: it adds `-o pipefail`, and without it
      # the failure of the prelude is INVISIBLE. The default shell is `bash -e`,
      # so a prelude that dies takes the brace group with it, `cat` never runs,
      # psql reads EOF and exits 0 -and the step passes having checked nothing.
      # Measured: that is exactly what happened on main until the scripts got
      # their executable bit, and the step reported success.
      - name: Authoritative writer checks
        shell: bash
        run: |
          { ./scripts/vectors-prelude.sh ; cat supabase/checks/authoritative-writer.sql ; } \
            | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Authoritative writer, second half: the three classes that create or
      # consume debt. Also piped through the vector prelude, because this one
      # reproduces the 19 reachable scenarios and all 22 split vectors.
      - name: Authoritative writer debt checks
        shell: bash
        run: |
          { ./scripts/vectors-prelude.sh ; cat supabase/checks/authoritative-writer-debt.sql ; } \
            | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Personal-mode provisioning and the seeded currency catalogue. Asserts
      # the twenty definitions by their fixed identity -regenerating a UUID
      # splits the environments in silence- and carries two deliberate
      # regressions: dropping the provisioner's SELECT policy on core.effect
      # must leave the composite FK as the thing that refuses the currency
      # change, and dropping the one on core.scope must break legitimate
      # provisioning. Evidence: supabase/e21/.
      - name: Personal provisioning checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/personal-provisioning.sql

      # Movement anatomy: concept, category, effective time, the income class and
      # the cross-class correction guard. Section G is the one that matters most:
      # it proves a writer of one class cannot correct an operation of another,
      # and G7 checks the property the guard protects -no live effect carries an
      # accounting class foreign to its operation's class- over everything the
      # check wrote, not just the cases it set up.
      - name: Movement anatomy checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/movement-anatomy.sql

      # Target balance, the frozen balance observation and annulment. Section D6
      # is the one that would fail silently without its RLS widening: an
      # annulment version has no effects, so without it the client cannot read
      # the current version and would fall back to showing the movement the user
      # just deleted.
      - name: Balance and annulment checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/balance-and-annulment.sql

      # The personal read surface: the operation as the unit, the correction
      # history, the derived balance and the batched observation. Two sections
      # carry weight beyond the obvious. A5 is a NEW guard rather than a relaxed
      # one -A4 still demands ZERO api views over the observation, and A5 bounds
      # the single function that may read it. And A10 is the file's only textual
      # assertion, deliberately: removing `version_kind = 'record'` was measured
      # to change nothing, so what has to be protected is the PRESENCE of the
      # criterion F06/ADR-006 §2 asks for, not its effect.
      - name: Personal read surface checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/read-surface.sql

      # Aggregated statistics. Section F is the one that justifies the surface
      # existing at all: 1200 operations aggregated with max_rows at 1000.
      # Falsified by truncating at 1000, which returns 500500 where the answer
      # is 720600 - the silently incomplete figure a client-side sum would have
      # produced, since PostgREST 16.1 refuses aggregate functions with PGRST123.
      - name: Personal statistics checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/personal-statistics.sql

      # Group provisioning. api.create_group builds scope, profile, membership,
      # participants and the creator's account link in ONE transaction, under
      # the third role. The check covers its privilege boundary and its
      # idempotency; a genuinely simultaneous replay needs real sessions and is
      # out of a single psql connection's reach.
      - name: Group provisioning checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/group-provisioning.sql

      # The shared expense, end to end: creation opens the participants'
      # presence periods (idempotently), the writer accepts concept and category
      # -refusing a private one with CATEGORY_NOT_SHAREABLE- and the two read
      # views publish one row per operation plus a server-side aggregate.
      #
      # Section E is the one that earns its keep: it orders four expenses whose
      # amounts and dates deliberately disagree, and asserts that ordering by
      # the TEXT of total_amount produces a different sequence than ordering by
      # the integer - which is why the view publishes total_order at all.
      #
      # Section F records the limit this design has: presences open at
      # current_date, so an expense dated before the group existed is refused.
      - name: Group expense flow checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/group-expense-flow.sql

      # F09/ADR-003: leaving a group and settling whoever left. Fixtures and
      # rollback: Ana leaves owing, Luis leaves owed, a group created and left
      # the same day, the barriers on inactive and retired participants, the
      # atomic multi-pair resolution with its CAS on amounts, the retirement
      # without a monetary operation, and the last member leaving.
      - name: Leave and settle checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/leave-and-settle.sql

      # F09/ADR-004: invitations. Issue (hash only, token shown once), preview
      # (identity only, throttle after 20 misses), redeem (claim, new, already
      # member, conflict on the link's primary key, retry), and the closed
      # doors: revoked, expired, and whoever left with a link (F09/ADR-003).
      - name: Group invitations checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/group-invitations.sql

      # The bell marks pending notices as seen on entry, bounded by the newest
      # notice the client had loaded: older ones beyond the page are included,
      # a later one is not, and nobody's boundary marks anybody else's rows.
      - name: Group notices seen checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/group-notices-seen.sql

      # The Gastos breakdown of Personal explains its total: one row per shared
      # share with context, the same rows personal_statistics sums; 4×25 + 10
      # paid by another = 110; my own payment stays cash in personal_operation;
      # correction, annulment, interval, exact reconciliation per category,
      # isolation between accounts, and history after leaving (F09/ADR-003).
      - name: Personal expense breakdown checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/personal-expense-breakdown.sql

      # Retiring an unlinked participant (explicit extension of F09/ADR-003 §6):
      # without history, with history and no pairs, net zero with crossed
      # pairs (STALE without the pairs; one debt effect per pair with them, no
      # cash), linked → PARTICIPANT_LINKED (also after leaving), retries,
      # outsider refused. The claim/retire race runs as real sessions below.
      - name: Retire participant checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/retire-participant.sql

      # Registered group payments and leaving without debt (F09/ADR-007 v3,
      # migration 20260912170000) against the REAL functions: pending pairs,
      # decomposition (direct pair, shortest paths, novation, not applicable),
      # CAS on the positions, no edition, annulment by either party even after
      # leaving, leave blocked by pending pairs, notices, Personal and the
      # bounded reopened-debt exception. The helper library only reads and
      # wraps; it carries no accounting. Rollback.
      - name: Group payments checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/group-payments-evidence.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # The departed participant's obligation is immutable (F09/ADR-008): a
      # correction, an annulment or a backdated creation that would change what
      # an expense attributes to someone who left is refused with no partial
      # write; concept/category and actives-only changes are allowed. Rollback.
      - name: Departed obligation checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/departed-obligation-evidence.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Settling a pair reopened with someone who left (20260913120000, F09/ADR-007
      # C6 exception 2): only the still-active party, only what an annulled
      # payment between them reopened, capped; the departed and third parties
      # refused; pay/annul cycles do not widen the cap; both gone, nobody.
      - name: Reopened pair payment checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/reopened-pair-payment.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Payments with a participant who has no account (20260913130000): the
      # debt closes, cash moves only in the Personal that exists, both
      # participant identities stay on the payment, no Personal or notice is
      # invented; third parties and two-ghost payments refused; exact reversal
      # on annulment; claim coherence by stable id; the bell of someone who
      # left marks their payment notices seen.
      - name: Ghost payment checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/ghost-payments.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Leaving at net zero with compensated pairs: the departure novation
      # (F09/ADR-007 C8) reassigns them without money, is not annullable, and the
      # departed party's later payment/annulment authorisation still holds.
      - name: Departure novation checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/departure-novation.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Associating a ghost to my account (F09/ADR-009): canonical pairs and nets,
      # historical cash incorporated once, views without the origin; and the
      # payment CAS compares the SAME participant set api.group_balance
      # publishes (20260914160000) — with a retired and a merged participant in
      # the group, payments before and after the association go through, and
      # the helper sends the client's real snapshot (rows of the view).
      - name: Associate participant checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/associate-participant.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Rejoining after leaving (F09/ADR-010): same canonical identity, a new
      # presence period, nothing else changes.
      - name: Rejoin after departure checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/rejoin-after-departure.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Active and historical link (F10/ADR-003, migration 20260918120000):
      # leaving ends the link, the departed identity leaves the present (Saldos,
      # count, positions photo) but keeps its history, is neither claimable nor
      # retirable, and whoever was in before rejoins as before or as a ghost.
      - name: Link lifecycle checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/link-lifecycle.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # The Personal start after the guest (F10/ADR-005): the guest-origin mark,
      # the insert-only decision, include as identity, fresh as a cutoff that
      # leaves prior group history out of balance/history/statistics/shares but
      # never out of debts, later operations in, prior ones edited still out,
      # derive_balance = personal_balance, auto-include on a first access with
      # no history.
      - name: Personal start checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/personal-start.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # The two closures F10/ADR-004 assigned to C0: retiring (or settling) a
      # merge source is refused with PARTICIPANT_MERGED, and a merge is one hop
      # by catalogue — a source is never a target, a target is never a source,
      # no re-pointing — whoever writes the row.
      - name: Merge invariant checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/merge-invariants.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Username (F12/ADR-001, F12.A1): the shared syntax vectors reproduced by
      # sec.normalize_handle / sec.assert_handle_valid and the seeded reserved
      # names; reserve/claim/change/set_public_name/resolve against the real
      # functions as each account (normal and anonymous claim); 7-day reservation
      # expiry without reading Auth, lazy eviction, 30-day cooldown, 90-day hold,
      # recovery by the old owner, resolver states and its 20/10 min throttle;
      # owners (all nomey_provisioner, none postgres), grants, own-row RLS,
      # insert-only journal, supabase_auth_admin still without anything in sec.
      # Piped through the vector prelude, like the writer checks.
      - name: Username checks
        shell: bash
        run: |
          { ./scripts/vectors-prelude.sh ; cat supabase/checks/username.sql ; } \
            | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Transfer proposals and the two-will internal_transfer (F12/ADR-002,
      # F12.B1, 20260926120000): structure, owners (provisioner for the proposal,
      # writer for the accounting, nothing new owned by postgres), EXECUTE per
      # role, the client without uid columns, the writer's created_by = actor
      # policies intact; create (no operation, replay, every refusal of §5 and
      # §20, the shared resolver throttle, not_found as a state), anti-spam
      # (3 pending per pair, 10 created / 60 min), accept (only the target,
      # -N/+N, parts, created_by = receiver, server date, one version,
      # PROPOSAL_* codes, negative balance allowed, currency mismatch, handle
      # resolved once), cancel/decline, irreversibility (TRANSFER_NOT_EDITABLE,
      # OPERATION_NOT_ANNULLABLE, persist_version backstop), the two views,
      # counts_in_personal with fresh, and the client not reaching core.
      - name: Transfer proposal checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/transfer-proposals.sql

      # Payment requests by link (F12/ADR-004, F12.B2, 20260927120000):
      # structure and owners (provisioner for the request, writer for the
      # accounting), the client without token_hash/created_by/paid_by, create
      # (no operation, token delivered once and only its sha256 stored, replay
      # with token null, the 20-pending cap and what frees a slot), preview as
      # states (ok/own with exactly the minimal fields, invalid counting and
      # throttled at 20/10 min without counting), pay (only one, -N/+N, parts
      # payer → creator, paid_by = created_by = owner of from, PAYMENT_REQUEST_*
      # codes, XOR with proposal_id, F3 fields refused, currency mismatch), the
      # B1 proposal path still alive, cancel, irreversibility, both views with
      # the current identity, and the client not reaching core or the hash.
      - name: Payment request checks
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/payment-requests.sql

      # Oversettlement guards refuse only what a correction or annulment
      # worsens (pair oriented by its settlements); the canonical
      # 5000/4000 → 3000 example still refuses.
      - name: Oversettlement delta checks
        run: cat supabase/checks/lib/group-payment-helpers.sql supabase/checks/oversettlement-delta.sql | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Link instance (F10/ADR-001 §1, §3; migrations 20260915120000 and
      # 20260917120000): link_id and origin on every link, S0 and baseline written
      # by every link creation under the rank-1 lock, claim baseline captured from
      # real history, the two audit relations insert-only, scope and owner
      # integrity enforced by policy, and no unlink/unclaim surface left
      # (F10/ADR-002: identity is permanent).
      - name: Link instance schema and creations
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/link-instance.sql

      # Catalogue guard: the live bodies of the eleven functions that read or
      # change identity (associate_participant and create_group included) take
      # the rank-1 lock in protocol order.
      - name: Group identity lock guard
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/group-identity-lock.sql

      # FX catalogue (F11/ADR-001 §5, F11/ADR-002 §5; migration 20260922120000):
      # the ECB source with EUR as pivot, the curated coverage of 17 of the 20
      # definitions in closed, non-overlapping intervals, the nomey_fx_ingest
      # role, and no application role able to write any of it.
      - name: FX catalogue and curated coverage
        run: docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < supabase/checks/fx-catalog.sql

      # FX ingest and daily fixation (F11/ADR-002; migration 20260923120000),
      # on fixture sources only: every completeness condition recorded with its
      # reason, one fixation per day from 00:00 Europe/Berlin, versions and
      # amendments, and the 36 cases of tests/vectors/fx-day.json reproduced by
      # the fixation. Through the vector prelude, hence `shell: bash`.
      - name: FX ingest and daily fixation
        shell: bash
        run: |
          { ./scripts/vectors-prelude.sh ; cat supabase/checks/fx-ingest.sql ; } \
            | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # FX resolver, derivation and conversion (F11/ADR-001 §6-§7; migration
      # 20260925120000): steps 5-8 over fixed days, 503 versus 422, R/P/K = 1,
      # coverage start and end, ARS/COP/CLP, the first ECB date, a converted
      # amount of 0 accepted and a rate of 0 refused, int64 limits, and parity
      # with rounding, conversion, fx-derivation, fx-dates and fx-source-decimal.
      # Nothing calls the resolver yet: no operation converts.
      - name: FX resolver and conversion
        shell: bash
        run: |
          { ./scripts/vectors-prelude.sh ; cat supabase/checks/fx-resolution.sql ; } \
            | docker exec -i supabase_db_Nomey psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1

      # Real concurrency. A single psql session has none, so the debt
      # serialization protocol of F03/ADR-010 §11 cannot be proven by a check: this
      # opens simultaneous sessions, the way E15-C did. It runs LAST because it
      # writes committed rows -a row lock only exists between transactions- and
      # it removes them again, asserting that nothing is left behind.
      #
      # RUN THROUGH THE ISOLATION WRAPPER, not the script itself. The wrapper
      # runs the whole concurrency test and additionally proves it touches no
      # row it did not create: it seeds a sentinel outside the fixture and
      # compares its fingerprint before and after. Running both would run the
      # concurrency test twice for nothing.
      #
      # It exists because this script used to clean up with whole-table deletes.
      # On CI's from-zero database that was invisible; on a populated one it
      # destroyed real data.
      - name: Debt serialization under real concurrency, and its isolation
        run: ./scripts/writer-debt-isolation.sh

      # Claim vs retire, both orders, as two real sessions sharing the per-scope
      # advisory lock: the loser must see the winner's state.
      - name: Retire/claim race (real sessions)
        run: bash scripts/retire-claim-race.sh

      # The identity lock under real concurrency: claim against the writer with
      # the payer as the account itself, both orders. Each outcome must equal a
      # serial order, with no cash lost or attributed to an account that did not
      # hold the link when it was written; the waiting session's wait is measured.
      - name: Group identity lock races (real sessions)
        run: bash scripts/identity-lock-race-evidence.sh

      # Folding a ghost into one's own identity: two accounts at once, a double
      # press with one key, and associate vs an expense naming the ghost, both
      # orders (F09/ADR-009; recorded as A2 debt in phase-10-opening.md §7).
      - name: Associate races (real sessions)
        run: bash scripts/associate-race-evidence.sh

      # Rejoining after leaving: two rejoins at once (two keys, then one key),
      # and rejoin vs a same-day expense naming the participant (F09/ADR-010).
      - name: Rejoin races (real sessions)
        run: bash scripts/rejoin-race-evidence.sh

      # Payments vs leaving vs annulment as two real sessions (F09/ADR-007 C5):
      # pay→leave, blocked leave→pay (+retry), double confirmation (one payment,
      # the other SETTLEMENT_STALE), annul→leave, leave→annul by whoever stays.
      - name: Group payment races (real sessions)
        run: bash scripts/group-payment-race-evidence.sh

      # Leaving vs creating, correcting and annulling an expense, both orders
      # (F09/ADR-008): the later session waits on the identity lock and the guard
      # decides on the post-leave state; a refused backdated creation leaves
      # no partial write, not even its idempotency key.
      - name: Departed obligation races (real sessions)
        run: bash scripts/departed-obligation-race-evidence.sh

      # The Personal start decision vs a group expense that writes the same
      # personal cash, as two real sessions (F10/ADR-005 §5): serialized by the
      # scope lock, and the instants reflect the serial order.
      - name: Personal start races (real sessions)
        run: bash scripts/personal-start-race-evidence.sh

      # The username lifecycle as two real sessions (F12/ADR-001, F12.A1): two
      # changes of the same account (the second waits and sees the cooldown),
      # a guest reservation vs a normal account asking for the same handle, a
      # claim racing the eviction of its expired reservation, and two accounts
      # asking for one handle. The unique index and the identity lock decide;
      # nobody ends up with two live handles.
      - name: Username races (real sessions)
        run: bash scripts/username-race-evidence.sh

      # Two REAL sign-ups through GoTrue at once, different emails, same
      # username (F12/ADR-001 §5, F12.A2): the before_user_created hook runs
      # inside GoTrue's transaction and the unique index arbitrates — exactly
      # one account and one reservation, the loser gets 409 USERNAME_TAKEN and
      # leaves neither auth.users nor any identity row. Three rounds.
      - name: Username sign-up races (real GoTrue)
        run: bash scripts/username-signup-race-evidence.sh

      # Transfer proposals as real sessions (F12/ADR-002 §10, §18; F12.B1):
      # accept vs cancel in both orders, decline vs accept, double accept with
      # two keys, retry with the same key while the first is open — at most one
      # terminal transition and at most one operation —, the per-sender budget
      # exact under concurrency (9 + 2 simultaneous → 10; 11 simultaneous → 10)
      # and distinct senders not waiting on each other. Fixture only; removed.
      - name: Transfer proposal races (real sessions)
        run: bash scripts/transfer-proposal-race-evidence.sh

      # Payment requests as real sessions (F12/ADR-004 §19, §23; F12.B2): two
      # payers at once, pay vs cancel in both orders, double tap with the same
      # key, two keys of the same payer, expiry before paying, and the
      # 20-pending cap exact under two simultaneous creations. Fixture only.
      - name: Payment request races (real sessions)
        run: bash scripts/payment-request-race-evidence.sh

      # Two ingests of the same source at once (F11/ADR-002 §4): the second
      # waits on the per-source advisory lock and fixes nothing already fixed,
      # whether it brings the same document or a different one. Fixture source
      # only; its rows are removed afterwards.
      - name: FX fixation races (real sessions)
        run: bash scripts/fx-fixation-race.sh

      # Balance serialization. Reproduces, corrected, the two races measured in
      # supabase/e22: two concurrent target adjustments land on the target, and
      # concurrent observations chain without gaps.
      - name: Balance serialization under real concurrency
        run: ./scripts/balance-concurrency.sh

      # Same reason, for provisioning: two simultaneous ensure_personal_scope
      # calls must produce ONE scope WITH its membership. A scope without its
      # membership leaves the owner unable to see their own effects -invariant
      # 11- and throws nothing. Verified capable of failing by dropping the
      # unique index, which reproduces the duplicate exactly.
      - name: Personal provisioning under real concurrency
        run: ./scripts/provisioning-concurrency.sh

      # The whole boundary, end to end, over HTTP:
      #   client -> Kong -> GoTrue (real JWT) -> PostgREST -> api.* -> writer -> RLS/core
      #
      # This is the one thing no SQL check can prove, because every other check
      # simulates identity. It signs up real users, calls the seven public
      # functions over HTTP with their tokens, and asserts the error contract of
      # F03/ADR-006 §9 against the real functions rather than E15's probes.
      #
      # No secrets: the publishable key is read at run time from the running
      # Kong's own configuration, so nothing is committed.
      #
      # ALSO THROUGH ITS ISOLATION WRAPPER, and for the same reason: this check
      # had the same whole-table deletes. The wrapper runs the entire boundary
      # check and proves a sentinel outside its fixture survives it untouched.
      - name: HTTP boundary with real JWT, and its isolation
        run: ./scripts/http-boundary-isolation.sh

      - name: Stop
        if: always()
        run: ./scripts/supabase-cli.sh stop --no-backup
